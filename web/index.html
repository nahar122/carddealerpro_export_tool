<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Card CSV Transformer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            max-width: 540px;
            margin: 4rem auto;
            padding: 0 1.5rem;
            color: #1a1a1a;
            background: #fafafa;
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
        p.lead { color: #555; margin-top: 0; margin-bottom: 2rem; }
        form {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #e1e1e1;
        }
        label { display: block; font-weight: 500; margin-bottom: 0.5rem; }
        input[type=file] {
            display: block;
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1.25rem;
            border: 1px dashed #c0c0c0;
            border-radius: 6px;
            background: #f7f7f7;
            font-size: 0.95rem;
        }
        button {
            background: #2563eb;
            color: white;
            border: 0;
            padding: 0.7rem 1.4rem;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover { background: #1d4ed8; }
        .footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #888;
            text-align: center;
        }
        .footer a { color: #555; }
    </style>
</head>
<body>
    <h1>Card CSV Transformer</h1>
    <p class="lead">Upload a CardDealerPro export CSV and download the 5-column listing version.</p>

    {{if .Error}}<div style="background:#fee;border:1px solid #f99;color:#900;padding:0.75rem;border-radius:6px;margin-bottom:1rem;">{{.Error}}</div>{{end}}

    <form action="/transform" method="post" enctype="multipart/form-data">
        <label for="file">CSV file</label>
        <input type="file" id="file" name="file" accept=".csv,text/csv" required>
        <button type="submit">Transform &amp; download</button>
    </form>

    <div class="footer">
        <a href="/shutdown">Quit</a>
    </div>
</body>
</html>
