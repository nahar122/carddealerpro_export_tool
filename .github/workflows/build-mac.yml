name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # macos-13 is Intel (x86_64). The resulting binary runs on Apple Silicon
    # Macs too via Rosetta 2, so a single x86_64 build covers all current Macs.
    # Switch to macos-14 if you want a native arm64 build (won't run on Intel).
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller tkinterdnd2

      - name: Build .app bundle
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Zip .app (preserves bundle metadata)
        # GitHub's upload-artifact zips the directory itself, but `ditto` is
        # the canonical macOS tool for round-tripping .app bundles without
        # losing the executable bit or symlinks.
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent CardCSVTransformer.app CardCSVTransformer.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CardCSVTransformer-macos
          path: dist/CardCSVTransformer.zip
          if-no-files-found: error
